[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flipper-switch-link"
version = "0.1.0"
description = "BLE gamepad state client for Flipper Zero"
requires-python = ">=3.10"
dependencies = ["bleak>=1,<4"]

[project.scripts]
flipper-link = "flipper_link.cli:main"

[tool.setuptools]
package-dir = {"" = "pc"}

[tool.setuptools.packages.find]
where = ["pc"]
